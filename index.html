<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!--Icones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Movie Randomizer</title>
</head>
<body>
    <div class="header">
        <!--<a class="voltar" href="index.html">
            <i class="fa-solid fa-backward"></i>
        </a>-->
        <div class="adicionar-filme">
            <p>Adicionar filme:</p>
            <input type="text" placeholder="Titulo">
            <button type="submit">
                <i class="fa-solid fa-plus"></i>
            </button>
            <p class="error">Nome inválido!</p>
        </div>
        <button class="editar">Editar</button>
    </div>
    <div class="lista-filmes">
        <!--filmes adicionados no js-->
    </div>
    <div class="header">
        <!--<a class="pagina-filmes" href="lista_filmes.html">
            <i class="fa-solid fa-plus"></i>
            Adicionar filmes à lista
        </a>-->
        <div class="escolher-filme">
            <button>Escolher filme</button>
        </div>
    </div>
    <div class="container-filme">
        <img src="https://image.tmdb.org/t/p/w500/neZ0ykEsPqxamsX6o5QNUFILQrz.jpg">
        <div class="info-filme">
            <div class="titulo">
                <h1 id="titulo-filme">Akira</h1>
                <h2 id="ano">1988</h2>
            </div>
            <div class="generos">
                <p>Animação</p>
                <p>Ficção Científica</p>
                <p>Aventura</p>
            </div>
            <p id="sinopse"></p>
        </div>
    </div>
    <!--<script src="env.js"></script>-->
    <script src="main.js"></script>
</body>
</html>
