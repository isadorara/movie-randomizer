<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--Adicionar filme à lista-->
        <div class="inserir_filme">
            <label for="inputFilme">Adicionar filme:</label>
            <input id="inputFilme" placeholder="Título">
            <button type="submit" id="addFilme">+</button>
        </div>
        <!--Escolher filme aleatório-->
        <div>
            <button id="escolherFilme">Escolher filme</button>
        </div>
        <!--Mostra filme escolhido-->
        <div class="roleta">
            <img id="poster">
            <h3 id="titulo"></h3>
        </div>
    </body>
    <script src="script.js"></script>
</html>
